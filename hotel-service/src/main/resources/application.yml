server:
  port: ${HOTEL_PORT:8082}
spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hotels;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  data:
    web:
      pageable:
        max-page-size: 100
security:
  jwt-secret: ${JWT_SECRET}
app:
  seed-data: ${SEED_DATA:true}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: logstash
